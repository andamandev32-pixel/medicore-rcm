<!DOCTYPE html>
<!-- =========================================================================
  สไลด์นำเสนอผู้บริหาร — ฉบับย่อ

  ต่างจาก present.html (ฉบับเต็ม) ตรงที่ย่อให้จบใน 15–20 นาที
  เน้นแกน "ของเดิม / ของใหม่ / ที่ปรับปรุงขึ้น" และแผนพัฒนา 6 เดือน
  ผังทุกอันเป็นภาพอินโฟกราฟิก SVG

  ใช้ present.js (กลไกเลื่อนหน้า) และ ds-present.css ตัวเดียวกับฉบับเต็ม
  ต่างกันแค่ไฟล์สไลด์ — present-exec-slides.js แทน present-slides.js

  ปุ่มลูกศร / PageUp-PageDown (presenter clicker) / Home-End เลื่อนสไลด์
  Ctrl+P ได้ PDF A4 แนวนอน หน้าละสไลด์
  ========================================================================= -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>MediClearing — นำเสนอผู้บริหาร (ฉบับย่อ)</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/ds-tokens.css">
    <link rel="stylesheet" href="css/ds-present.css">
</head>
<body>

<div class="pr-app">

    <header class="pr-topbar">
        <div class="pr-brand">
            <span class="pr-brand-mark">+</span>
            <span>MediClearing</span>
            <span class="pr-brand-sub">ระบบบริหารวงจรรายได้โรงพยาบาล · ฉบับย่อ</span>
        </div>
        <div class="pr-top-actions">
            <button class="pr-btn" type="button" onclick="Deck.toggleFullscreen()">เต็มจอ</button>
            <button class="pr-btn" type="button" onclick="window.print()">พิมพ์ / PDF</button>
            <!-- ลิงก์ไปศูนย์รวม ไม่ระบุจำนวนหน้าตรงนี้ — เคยเขียน "ฉบับเต็ม 20 หน้า" ค้างไว้
                 แล้วเพี้ยนทุกครั้งที่แทรกสไลด์ · จำนวนหน้าอยู่ที่ DS_DECKS ที่เดียว -->
            <a class="pr-btn" href="present-hub.html">สไลด์ทั้งหมด</a>
            <a class="pr-btn accent" href="claim-dashboard.html" target="_blank" rel="noopener">เปิดระบบต้นแบบ</a>
        </div>
    </header>

    <div class="pr-viewport">
        <div class="pr-deck" id="deck"><!-- สไลด์ render ด้วย present.js --></div>
    </div>

    <div class="pr-controls">
        <button class="pr-nav-btn" id="prev" type="button" aria-label="สไลด์ก่อนหน้า">&#8249;</button>
        <div class="pr-dots" id="dots"></div>
        <span class="pr-counter" id="counter">1 / 1</span>
        <button class="pr-nav-btn" id="next" type="button" aria-label="สไลด์ถัดไป">&#8250;</button>
        <span class="pr-hint">ใช้ปุ่ม ← → หรือ presenter clicker</span>
    </div>

</div>

<!-- ⚠️ ลำดับสำคัญ: present-exec-slides.js เรียกฟังก์ชันวาดผังตอนสร้างอาร์เรย์ทันที
     present-flows.js จึงต้องโหลดก่อนเสมอ
     present-flows-modules.js ตามมาเป็นตัวที่สอง (ใช้ PRF/prfBox ของไฟล์แรก) —
     deck นี้เรียก pmIpdFlow() สำหรับผังผู้ป่วยใน -->
<script src="js/present-flows.js"></script>
<script src="js/present-flows-modules.js"></script>
<script src="js/present-exec-slides.js"></script>
<script src="js/present.js"></script>
</body>
</html>
