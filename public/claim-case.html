<!DOCTYPE html>
<!-- =========================================================================
  รายละเอียดเคส (Claim Case Detail) — SRS §10
  workspace 3 คอลัมน์: คิวเคส / รายละเอียด+ผลกฎ+หลักฐาน / แผงดำเนินการ

  ⚠️ หน้าต้นแบบ: ข้อมูลจำลองล้วน ไม่เรียก /api จึงไม่ gate ด้วย Auth.requireLogin()
     เมื่อผูก backend จริง ให้เพิ่มบรรทัด Auth.requireLogin(); กลับเข้าไปในส่วนหัวของหน้า
     และเปลี่ยน MockDB.* เป็น fetch('/api/...') ตาม doc/PAGE-GUIDE.md §4
  ========================================================================= -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore RCM — รายละเอียดเคส</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/ds-tokens.css">
    <link rel="stylesheet" href="css/ds-base.css">
    <link rel="stylesheet" href="css/ds-navbar.css">
    <link rel="stylesheet" href="css/ds-layout.css">
    <link rel="stylesheet" href="css/ds-components.css">
    <link rel="stylesheet" href="css/ds-overlays.css">
    <link rel="stylesheet" href="css/ds-print.css">
    <link rel="stylesheet" href="css/ds-portal.css">
    <link rel="stylesheet" href="css/ds-chart.css">

    <script src="js/ds/ds-auth.js"></script>
</head>
<body data-page="claim-case" class="ds-shell-page">

    <nav id="appNavbar"></nav>

    <div class="ds-shell cols-3" id="shell">

        <!-- ══════════ ซ้าย — คิวเคส ══════════ -->
        <aside class="ds-pane-left" id="paneLeft">
            <div class="ds-pane-header">
                <h3><i data-lucide="folder-open" class="mi"></i> คิวเคส</h3>
                <span class="ds-pane-count" id="listCount">0 รายการ</span>
            </div>

            <div class="ds-pane-tools">
                <select class="sip-select" id="fFund" onchange="CaseView.renderList()">
                    <option value="all">ทุกกองทุน</option>
                </select>
            </div>

            <div class="ds-pilltabs" id="pillTabs"></div>

            <input type="text" class="ds-pane-search" id="listSearch"
                   placeholder="ค้นหา HN / ชื่อ / รหัสเคส..." oninput="CaseView.renderList()">

            <div class="ds-pane-scroll" id="listContainer"></div>
        </aside>

        <!-- ══════════ กลาง — รายละเอียด ══════════ -->
        <main class="ds-pane-main" id="paneMain">

            <div class="ds-empty-state" id="emptyState">
                <div class="ds-empty-state-icon"><i data-lucide="mouse-pointer-click"></i></div>
                <div class="ds-empty-state-title">เลือกเคสจากคิวด้านซ้าย</div>
                <div class="ds-empty-state-desc">
                    เพื่อดูผลตรวจกฎ หลักฐานที่ใช้ตัดสิน เอกสารประกอบ และสถานะฝั่ง สปสช.
                </div>
            </div>

            <div id="detailWrap" style="display:none">

                <div class="ds-context-bar">
                    <button class="ds-pane-toggle" onclick="CaseView.toggleLeft()" title="ซ่อน/แสดงคิวเคส">
                        <i data-lucide="menu" class="mi"></i>
                    </button>
                    <div class="ds-context-avatar" id="ctxAvatar">–</div>
                    <div class="ds-context-info">
                        <div class="ds-context-name">
                            <span id="ctxName">—</span>
                            <span id="ctxChip"></span>
                        </div>
                        <div class="ds-context-meta" id="ctxMeta"></div>
                    </div>
                    <div class="ds-context-aside">
                        <div class="ds-alert-card" id="ctxAlert" style="display:none" onclick="CaseView.showAlert()">
                            <i data-lucide="alert-triangle" class="ac-ico"></i>
                            <div class="ac-body">
                                <span class="ac-label" id="ctxAlertLabel">ต้องดำเนินการ</span>
                                <strong id="ctxAlertText">—</strong>
                            </div>
                            <i data-lucide="eye" class="ac-view"></i>
                        </div>
                    </div>
                </div>

                <div style="padding:12px 16px 24px">
                    <div id="demoBanner"></div>

                    <div class="ds-tabs">
                        <button class="ds-tab active" onclick="CaseView.switchTab('overview', this)">
                            <i data-lucide="layout-grid" class="mi"></i> ภาพรวม</button>
                        <button class="ds-tab" onclick="CaseView.switchTab('rules', this)">
                            <i data-lucide="shield-check" class="mi"></i> ผลกฎ
                            <span class="tab-notif" id="ruleBadge" style="display:none">0</span></button>
                        <button class="ds-tab" onclick="CaseView.switchTab('evidence', this)">
                            <i data-lucide="microscope" class="mi"></i> หลักฐาน</button>
                        <button class="ds-tab" onclick="CaseView.switchTab('docs', this)">
                            <i data-lucide="paperclip" class="mi"></i> เอกสาร</button>
                        <button class="ds-tab" onclick="CaseView.switchTab('timeline', this)">
                            <i data-lucide="history" class="mi"></i> Timeline</button>
                        <button class="ds-tab" onclick="CaseView.switchTab('nhso', this)">
                            <i data-lucide="hospital" class="mi"></i> สถานะ NHSO</button>
                    </div>

                    <div class="ds-tab-content active" id="tabOverview"></div>
                    <div class="ds-tab-content" id="tabRules"></div>
                    <div class="ds-tab-content" id="tabEvidence"></div>
                    <div class="ds-tab-content" id="tabDocs"></div>
                    <div class="ds-tab-content" id="tabTimeline"></div>
                    <div class="ds-tab-content" id="tabNhso"></div>
                </div>
            </div>
        </main>

        <!-- ══════════ ขวา — แผงดำเนินการ ══════════ -->
        <aside class="ds-pane-right" id="paneRight">
            <div class="ds-pane-header">
                <h3><i data-lucide="pen-line" class="mi"></i> ดำเนินการ</h3>
            </div>
            <div class="ds-pane-scroll" style="padding:0 16px 100px" id="actionPane">
                <div class="ds-empty">เลือกเคสก่อน</div>
            </div>
            <div class="ds-actions">
                <button class="btn btn-outline" onclick="CaseView.reload()">ยกเลิก</button>
                <button class="btn btn-save" onclick="CaseView.saveWork()">บันทึก</button>
                <button class="btn btn-save-send" onclick="CaseView.saveAndRecheck()">บันทึกและตรวจซ้ำ</button>
            </div>
        </aside>

    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/ds/ds-icons.js"></script>
    <script src="js/ds/ds-navbar.js"></script>
    <script src="js/ds/ds-drawer.js"></script>
    <script src="js/ds/ds-toast.js"></script>
    <script src="js/ds/ds-doc-parts.js"></script>
    <script src="js/ds/ds-doc-print.js"></script>

    <script src="js/mock/mock-core.js"></script>
    <script src="js/mock/mock-session.js"></script>
    <script src="js/mock/mock-admin.js"></script>
    <script src="js/mock/mock-nhso.js"></script>
    <script src="js/mock/mock-claims.js"></script>
    <script src="js/mock/mock-tasks.js"></script>

    <script src="js/claim-case.js"></script>
</body>
</html>
