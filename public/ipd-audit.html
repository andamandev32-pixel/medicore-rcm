<!DOCTYPE html>
<!-- =========================================================================
  ตรวจแฟ้มผู้ป่วยใน / ประเมินก่อนส่งตรวจ (IPD Chart Audit)
  workspace 3 คอลัมน์: คิวแฟ้มรอตรวจ / เงื่อนไขกองทุน+แฟ้ม+เวชระเบียน+DRG+กฎ / แผงประเมิน

  หน้านี้คือด่านสุดท้ายก่อนส่งเบิก — ตรวจแฟ้มผู้ป่วยในตามเงื่อนไขของแต่ละกองทุน
  ผ่านแล้วจึงต่อคิวไปหน้า Claim Worklist / ส่งเบิก NHSO ของเดิม

  ⚠️ หน้าต้นแบบ: ข้อมูลจำลองล้วน ไม่เรียก /api จึงไม่ gate ด้วย Auth.requireLogin()
     เมื่อผูก backend จริง ให้เพิ่มบรรทัด Auth.requireLogin(); กลับเข้าไปในส่วนหัวของหน้า
     และเปลี่ยน MockDB.* เป็น fetch('/api/...') ตาม doc/PAGE-GUIDE.md §4
  ========================================================================= -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>MediClearing — ตรวจแฟ้มผู้ป่วยใน</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/ds-tokens.css">
    <link rel="stylesheet" href="css/ds-base.css">
    <link rel="stylesheet" href="css/ds-navbar.css">
    <link rel="stylesheet" href="css/ds-layout.css">
    <link rel="stylesheet" href="css/ds-components.css">
    <link rel="stylesheet" href="css/ds-overlays.css">
    <link rel="stylesheet" href="css/ds-print.css">
    <link rel="stylesheet" href="css/ds-portal.css">
    <link rel="stylesheet" href="css/ds-chart.css">

    <script src="js/ds/ds-auth.js"></script>
</head>
<body data-page="ipd-audit" class="ds-shell-page">

    <nav id="appNavbar"></nav>

    <div class="ds-shell cols-3" id="shell">

        <!-- ══════════ ซ้าย — คิวแฟ้มรอตรวจ ══════════ -->
        <aside class="ds-pane-left" id="paneLeft">
            <div class="ds-pane-header">
                <h3><i data-lucide="clipboard-check" class="mi"></i> คิวแฟ้มรอตรวจ</h3>
                <span class="ds-pane-count" id="listCount">0 รายการ</span>
            </div>

            <div class="ds-pane-tools">
                <select class="sip-select" id="fFund" onchange="IpdAudit.renderList()">
                    <option value="all">ทุกกองทุน</option>
                </select>
                <select class="sip-select" id="fWard" onchange="IpdAudit.renderList()">
                    <option value="all">ทุกหอผู้ป่วย</option>
                </select>
            </div>

            <div class="ds-pilltabs" id="pillTabs"></div>

            <input type="text" class="ds-pane-search" id="listSearch"
                   placeholder="ค้นหา AN / HN / ชื่อ..." oninput="IpdAudit.renderList()">

            <div class="ds-pane-scroll" id="listContainer"></div>
        </aside>

        <!-- ══════════ กลาง — การตรวจแฟ้ม ══════════ -->
        <main class="ds-pane-main" id="paneMain">

            <div class="ds-empty-state" id="emptyState">
                <div class="ds-empty-state-icon"><i data-lucide="mouse-pointer-click"></i></div>
                <div class="ds-empty-state-title">เลือกแฟ้มจากคิวด้านซ้าย</div>
                <div class="ds-empty-state-desc">
                    เพื่อตรวจตามเงื่อนไขของกองทุนที่ผู้ป่วยใช้สิทธิ — เอกสารบังคับ ความครบของแฟ้ม
                    ความครบของเวชระเบียน กลุ่ม DRG และผลกฎ
                </div>
            </div>

            <div id="detailWrap" style="display:none">

                <div class="ds-context-bar">
                    <button class="ds-pane-toggle" onclick="IpdAudit.toggleLeft()" title="ซ่อน/แสดงคิว">
                        <i data-lucide="menu" class="mi"></i>
                    </button>
                    <div class="ds-context-avatar" id="ctxAvatar">–</div>
                    <div class="ds-context-info">
                        <div class="ds-context-name">
                            <span id="ctxName">—</span>
                            <span id="ctxChip"></span>
                        </div>
                        <div class="ds-context-meta" id="ctxMeta"></div>
                    </div>
                    <div class="ds-context-aside">
                        <div class="ds-alert-card" id="ctxAlert" style="display:none" onclick="IpdAudit.showAlert()">
                            <i data-lucide="alert-triangle" class="ac-ico"></i>
                            <div class="ac-body">
                                <span class="ac-label" id="ctxAlertLabel">ต้องดำเนินการ</span>
                                <strong id="ctxAlertText">—</strong>
                            </div>
                            <i data-lucide="eye" class="ac-view"></i>
                        </div>
                    </div>
                </div>

                <div style="padding:12px 16px 24px">
                    <div id="demoBanner"></div>

                    <div class="ds-tabs">
                        <button class="ds-tab active" onclick="IpdAudit.switchTab('fund', this)">
                            <i data-lucide="shield-check" class="mi"></i> เงื่อนไขกองทุน
                            <span class="tab-notif" id="fundBadge" style="display:none">0</span></button>
                        <button class="ds-tab" onclick="IpdAudit.switchTab('files', this)">
                            <i data-lucide="folder" class="mi"></i> แฟ้ม 1–15
                            <span class="tab-notif" id="fileBadge" style="display:none">0</span></button>
                        <button class="ds-tab" onclick="IpdAudit.switchTab('chart', this)">
                            <i data-lucide="file-text" class="mi"></i> เวชระเบียน
                            <span class="tab-notif" id="chartBadge" style="display:none">0</span></button>
                        <button class="ds-tab" onclick="IpdAudit.switchTab('drg', this)">
                            <i data-lucide="layers" class="mi"></i> DRG และการเงิน</button>
                        <button class="ds-tab" onclick="IpdAudit.switchTab('rules', this)">
                            <i data-lucide="git-branch" class="mi"></i> ผลกฎ
                            <span class="tab-notif" id="ruleBadge" style="display:none">0</span></button>
                        <button class="ds-tab" onclick="IpdAudit.switchTab('summary', this)">
                            <i data-lucide="history" class="mi"></i> สรุป / Timeline</button>
                    </div>

                    <div class="ds-tab-content active" id="tabFund"></div>
                    <div class="ds-tab-content" id="tabFiles"></div>
                    <div class="ds-tab-content" id="tabChart"></div>
                    <div class="ds-tab-content" id="tabDrg"></div>
                    <div class="ds-tab-content" id="tabRules"></div>
                    <div class="ds-tab-content" id="tabSummary"></div>
                </div>
            </div>
        </main>

        <!-- ══════════ ขวา — แผงประเมิน ══════════ -->
        <aside class="ds-pane-right" id="paneRight">
            <div class="ds-pane-header">
                <h3><i data-lucide="clipboard-check" class="mi"></i> ผลการประเมิน</h3>
            </div>
            <div class="ds-pane-scroll" style="padding:0 16px 110px" id="actionPane">
                <div class="ds-empty">เลือกแฟ้มก่อน</div>
            </div>
            <div class="ds-actions">
                <button class="btn btn-outline" onclick="IpdAudit.saveDraft()">บันทึกร่าง</button>
                <button class="btn btn-danger" onclick="IpdAudit.returnCase()">ตีกลับให้แก้</button>
                <button class="btn btn-save-send" onclick="IpdAudit.clearCase()">ผ่าน — ส่งเข้าคิวส่งเบิก</button>
            </div>
        </aside>

    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/ds/ds-icons.js"></script>
    <script src="js/ds/ds-navbar.js"></script>
    <script src="js/ds/ds-drawer.js"></script>
    <script src="js/ds/ds-toast.js"></script>
    <script src="js/ds/ds-doc-parts.js"></script>
    <script src="js/ds/ds-doc-print.js"></script>
    <script src="js/ds/ds-chart.js"></script>

    <script src="js/mock/mock-core.js"></script>
    <script src="js/mock/mock-session.js"></script>
    <script src="js/mock/mock-admin.js"></script>
    <script src="js/mock/mock-nhso.js"></script>
    <script src="js/mock/mock-claims.js"></script>
    <script src="js/mock/mock-ipd.js"></script>
    <script src="js/mock/mock-rules.js"></script>
    <script src="js/mock/mock-tasks.js"></script>

    <script src="js/ipd-audit.js"></script>
</body>
</html>
