<!DOCTYPE html>
<!-- =========================================================================
  ติดตามการรักษาระหว่าง admit (IPD Concurrent Tracking)
  workspace 3 คอลัมน์: ผู้ป่วยที่ยังนอน / ไทม์ไลน์รายวัน+ค่าใช้จ่าย+เอกสาร / แผงบันทึก

  เจตนาของหน้านี้: จับสิ่งที่ยังขาด "ตั้งแต่ผู้ป่วยยังนอนอยู่" ไม่ต้องรอจำหน่าย
  เพราะเอกสารที่หายไปตอนจำหน่ายแล้ว ตามเก็บทีหลังยากกว่ามาก

  ⚠️ หน้าต้นแบบ: ข้อมูลจำลองล้วน ไม่เรียก /api จึงไม่ gate ด้วย Auth.requireLogin()
     เมื่อผูก backend จริง ให้เพิ่มบรรทัด Auth.requireLogin(); กลับเข้าไปในส่วนหัวของหน้า
     และเปลี่ยน MockDB.* เป็น fetch('/api/...') ตาม doc/PAGE-GUIDE.md §4
  ========================================================================= -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>MediClearing — ติดตามระหว่างนอน</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/ds-tokens.css">
    <link rel="stylesheet" href="css/ds-base.css">
    <link rel="stylesheet" href="css/ds-navbar.css">
    <link rel="stylesheet" href="css/ds-layout.css">
    <link rel="stylesheet" href="css/ds-components.css">
    <link rel="stylesheet" href="css/ds-overlays.css">
    <link rel="stylesheet" href="css/ds-print.css">
    <link rel="stylesheet" href="css/ds-portal.css">
    <link rel="stylesheet" href="css/ds-chart.css">

    <script src="js/ds/ds-auth.js"></script>
</head>
<body data-page="ipd-admit" class="ds-shell-page">

    <nav id="appNavbar"></nav>

    <div class="ds-shell cols-3" id="shell">

        <!-- ══════════ ซ้าย — ผู้ป่วยที่ยังนอนอยู่ ══════════ -->
        <aside class="ds-pane-left" id="paneLeft">
            <div class="ds-pane-header">
                <h3><i data-lucide="bed" class="mi"></i> ผู้ป่วยที่ยังนอน</h3>
                <span class="ds-pane-count" id="listCount">0 รายการ</span>
            </div>

            <div class="ds-pane-tools">
                <select class="sip-select" id="fFund" onchange="IpdAdmit.renderList()">
                    <option value="all">ทุกกองทุน</option>
                </select>
                <select class="sip-select" id="fWard" onchange="IpdAdmit.renderList()">
                    <option value="all">ทุกหอผู้ป่วย</option>
                </select>
            </div>

            <div class="ds-pilltabs" id="pillTabs"></div>

            <input type="text" class="ds-pane-search" id="listSearch"
                   placeholder="ค้นหา AN / HN / ชื่อ..." oninput="IpdAdmit.renderList()">

            <div class="ds-pane-scroll" id="listContainer"></div>
        </aside>

        <!-- ══════════ กลาง — รายละเอียดการนอน ══════════ -->
        <main class="ds-pane-main" id="paneMain">

            <div class="ds-empty-state" id="emptyState">
                <div class="ds-empty-state-icon"><i data-lucide="mouse-pointer-click"></i></div>
                <div class="ds-empty-state-title">เลือกผู้ป่วยจากรายการด้านซ้าย</div>
                <div class="ds-empty-state-desc">
                    เพื่อดูไทม์ไลน์รายวัน รหัสที่บันทึกแล้ว ค่าใช้จ่ายสะสมเทียบประมาณการรับ
                    และเอกสารที่ยังขาดตั้งแต่ยังไม่จำหน่าย
                </div>
            </div>

            <div id="detailWrap" style="display:none">

                <div class="ds-context-bar">
                    <button class="ds-pane-toggle" onclick="IpdAdmit.toggleLeft()" title="ซ่อน/แสดงรายการ">
                        <i data-lucide="menu" class="mi"></i>
                    </button>
                    <div class="ds-context-avatar" id="ctxAvatar">–</div>
                    <div class="ds-context-info">
                        <div class="ds-context-name">
                            <span id="ctxName">—</span>
                            <span id="ctxChip"></span>
                        </div>
                        <div class="ds-context-meta" id="ctxMeta"></div>
                    </div>
                    <div class="ds-context-aside">
                        <div class="ds-alert-card" id="ctxAlert" style="display:none" onclick="IpdAdmit.showAlert()">
                            <i data-lucide="alert-triangle" class="ac-ico"></i>
                            <div class="ac-body">
                                <span class="ac-label" id="ctxAlertLabel">ต้องดำเนินการ</span>
                                <strong id="ctxAlertText">—</strong>
                            </div>
                            <i data-lucide="eye" class="ac-view"></i>
                        </div>
                    </div>
                </div>

                <div style="padding:12px 16px 24px">
                    <div id="demoBanner"></div>

                    <div class="ds-tabs">
                        <button class="ds-tab active" onclick="IpdAdmit.switchTab('overview', this)">
                            <i data-lucide="layout-grid" class="mi"></i> ภาพรวมการนอน</button>
                        <button class="ds-tab" onclick="IpdAdmit.switchTab('daily', this)">
                            <i data-lucide="calendar-days" class="mi"></i> ไทม์ไลน์รายวัน
                            <span class="tab-notif" id="dailyBadge" style="display:none">0</span></button>
                        <button class="ds-tab" onclick="IpdAdmit.switchTab('coding', this)">
                            <i data-lucide="stethoscope" class="mi"></i> วินิจฉัย / หัตถการ</button>
                        <button class="ds-tab" onclick="IpdAdmit.switchTab('cost', this)">
                            <i data-lucide="wallet" class="mi"></i> ค่าใช้จ่าย vs ประมาณการ</button>
                        <button class="ds-tab" onclick="IpdAdmit.switchTab('gaps', this)">
                            <i data-lucide="file-warning" class="mi"></i> เอกสาร / แฟ้มที่ขาด
                            <span class="tab-notif" id="gapBadge" style="display:none">0</span></button>
                    </div>

                    <div class="ds-tab-content active" id="tabOverview"></div>
                    <div class="ds-tab-content" id="tabDaily"></div>
                    <div class="ds-tab-content" id="tabCoding"></div>
                    <div class="ds-tab-content" id="tabCost"></div>
                    <div class="ds-tab-content" id="tabGaps"></div>
                </div>
            </div>
        </main>

        <!-- ══════════ ขวา — แผงบันทึกประจำวัน ══════════ -->
        <aside class="ds-pane-right" id="paneRight">
            <div class="ds-pane-header">
                <h3><i data-lucide="pen-line" class="mi"></i> บันทึกและจำหน่าย</h3>
            </div>
            <div class="ds-pane-scroll" style="padding:0 16px 110px" id="actionPane">
                <div class="ds-empty">เลือกผู้ป่วยก่อน</div>
            </div>
            <div class="ds-actions">
                <button class="btn btn-outline" onclick="IpdAdmit.reload()">ยกเลิก</button>
                <button class="btn btn-save" onclick="IpdAdmit.saveNote()">บันทึก</button>
                <button class="btn btn-save-send" onclick="IpdAdmit.openDischarge()">จำหน่ายและส่งตรวจแฟ้ม</button>
            </div>
        </aside>

    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/ds/ds-icons.js"></script>
    <script src="js/ds/ds-navbar.js"></script>
    <script src="js/ds/ds-drawer.js"></script>
    <script src="js/ds/ds-toast.js"></script>
    <script src="js/ds/ds-doc-parts.js"></script>
    <script src="js/ds/ds-doc-print.js"></script>
    <script src="js/ds/ds-chart.js"></script>

    <script src="js/mock/mock-core.js"></script>
    <script src="js/mock/mock-session.js"></script>
    <script src="js/mock/mock-admin.js"></script>
    <script src="js/mock/mock-nhso.js"></script>
    <script src="js/mock/mock-claims.js"></script>
    <script src="js/mock/mock-ipd.js"></script>
    <script src="js/mock/mock-rules.js"></script>
    <script src="js/mock/mock-tasks.js"></script>
    <!-- สะพานข้อมูลจริง: ต้องมาหลัง mock ทุกไฟล์ (hydrate ทับค่าคงที่ในที่) -->
    <script src="js/mock/mock-refdata.js"></script>
    <script src="js/mock/mock-ipddata.js"></script>

    <script src="js/ipd-admit.js"></script>
</body>
</html>
